name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mealplan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.25"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Tests (PostgreSQL)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mealplan_test
      - name: Migrations up/down on PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/mealplan_test
          SECRET_KEY: ci-only-secret-key-0123456789-abcdefghijkl
        run: |
          uv run python -c "from app.db import Base, engine; import app.models; Base.metadata.drop_all(engine)"
          uv run alembic upgrade head && uv run alembic check && uv run alembic downgrade base

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -S style install.sh

  frontend-and-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.25"
      - run: npm ci && npm run build
        working-directory: frontend
      - run: uv sync --frozen
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
